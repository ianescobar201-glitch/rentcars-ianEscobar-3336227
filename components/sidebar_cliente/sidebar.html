<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barra de navegación | Rentcars</title>
</head>
<body>
<aside class="sidebar-container bg-dark-sidebar d-flex flex-column flex-shrink-0 p-3 text-white">
    <!-- Logo / Marca -->
    <a href="../../index.html" class="d-flex align-items-center mb-4 text-white text-decoration-none px-2 pt-2">
        <i class="bi bi-car-front-fill fs-3 text-primary me-2"></i>
        <span class="fs-4 fw-bold tracking-wide">rentcars</span>
    </a>

    <hr class="border-secondary my-1">

    <!-- Opciones de Navegación Obligatorias -->
    <ul class="nav nav-pills flex-column mb-auto gap-2 mt-3">
        <li class="nav-item">
            <a href="../vehiculos/detalle-vehiculo.html" class="nav-link sidebar-link d-flex align-items-center px-3 py-2 text-white-50" id="nav-vehiculos">
                <i class="bi bi-car-front me-3 fs-5"></i>
                <span class="fw-semibold">Vehículos</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="../reservas/nueva.html" class="nav-link sidebar-link d-flex align-items-center px-3 py-2 text-white-50" id="nav-reservas">
                <i class="bi bi-calendar-check me-3 fs-5"></i>
                <span class="fw-semibold">Reservas</span>
            </a>
        </li>
    </ul>

    <hr class="border-secondary my-3">

    <!-- Perfil del Cliente Autenticado -->
    <div class="px-2">
        <div class="d-flex align-items-center text-white text-decoration-none">
            <!-- Avatar dinámico con Iniciales -->
            <div id="cliente-avatar" class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-2 text-white fw-bold shadow-sm" style="width: 38px; height: 38px; font-size: 0.9rem;">
                --
            </div>
            <div class="overflow-hidden">
                <!-- Nombre y Apellido ingresados -->
                <strong id="cliente-nombre-completo" class="small d-block text-white text-truncate" style="max-width: 160px;">
                    Cargando perfil...
                </strong>
                <!-- Correo o Estado -->
                <span id="cliente-email" class="text-white-50 d-block text-truncate" style="font-size: 0.75rem; max-width: 160px;">
                    Cargando perfil...
                </span>
            </div>
        </div>
    </div>
</aside>
</body>
</html>
 <!-- sidebar reutilizable para cliente -->
